name: Contender 25 research validation

on:
  push:
    branches:
      - research/reflection-indexed-roundtower-contender25-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"
      - name: Record toolchain
        run: |
          set -o pipefail
          {
            echo "commit: $GITHUB_SHA"
            lake env lean --version
            lake --version
          } 2>&1 | tee validation-ci.log
      - name: Precompile accepted base
        run: |
          set -o pipefail
          { /usr/bin/time -f "accepted base: %e s" lake build BusyLean.Comparison24; } 2>&1 | tee -a validation-ci.log
      - name: Check Contender 25 definitions
        run: |
          set -o pipefail
          { /usr/bin/time -f "definition phase: %e s" lake build BusyLean.Contender25; } 2>&1 | tee -a validation-ci.log
      - name: Check Contender 25 proofs
        run: |
          set -o pipefail
          { /usr/bin/time -f "proof phase: %e s" lake build BusyLean.Comparison25; } 2>&1 | tee -a validation-ci.log
      - name: Run focused axiom and closure audit
        run: |
          set -o pipefail
          lake env lean test/Contender25Audit.lean 2>&1 | tee -a validation-ci.log
      - name: Upload validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contender25-validation
          path: validation-ci.log
