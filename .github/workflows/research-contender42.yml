name: Research Contender 42

on:
  push:
    branches:
      - research/contender42-universal-reflection-20261013
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build-args: BusyLean.Comparison42
      - name: Universal-language smoke tests
        run: lake env lean test/UniversalLanguageSmoke.lean
      - name: Axiom and dependency audit
        run: lake env lean test/Contender42Audit.lean
