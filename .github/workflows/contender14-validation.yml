name: Validate Contender 14

on:
  push:
    branches:
      - ai/contender14-validation-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out BusyLean
        uses: actions/checkout@v4

      - name: Install Lean toolchain manager
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Record tool versions
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p validation
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "runner=$(uname -a)"
            "$HOME/.elan/bin/lean" --version
            "$HOME/.elan/bin/lake" --version
          } | tee validation/tool-versions.txt

      - name: Prebuild accepted dependencies
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p validation
          /usr/bin/time -f $'elapsed_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M' \
            lake build BusyLean.Comparison13 BusyLean.MetaReflectionFacts \
              BusyLean.ReflectionFacts > validation/prebuild.log 2>&1

      - name: Compile definitions, comparisons, and audit
        shell: bash
        run: |
          set +e
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p validation
          rc=0
          run_one () {
            local label="$1"
            shift
            echo "===== ${label}: $* =====" | tee "validation/${label}.log"
            /usr/bin/time -f $'elapsed_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M' \
              "$@" >> "validation/${label}.log" 2>&1
            local status=$?
            echo "exit_status=${status}" | tee -a "validation/${label}.log"
            if [ "$status" -ne 0 ]; then rc=1; fi
          }
          run_one definition lake build BusyLean.Contender14
          run_one comparison lake build BusyLean.Comparison14
          run_one audit lake env lean test/Contender14Audit.lean
          exit "$rc"

      - name: Upload validation bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contender14-validation
          if-no-files-found: error
          retention-days: 7
          path: |
            validation/
            BusyLean/Contender14.lean
            BusyLean/Comparison14.lean
            test/Contender14Audit.lean
