name: Validate Contender 14

on:
  push:
    branches:
      - ai/contender14-validation-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out BusyLean
        uses: actions/checkout@v4

      - name: Restore Lean toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Install Lean toolchain manager and pinned toolchain
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            ok=0
            for attempt in 1 2 3; do
              if timeout 120 bash -c \
                'curl --retry 3 --retry-delay 2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none'; then
                ok=1
                break
              fi
              sleep 5
            done
            test "$ok" -eq 1
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          toolchain="$(tr -d '\r\n' < lean-toolchain)"
          ok=0
          for attempt in 1 2 3; do
            if timeout 240 elan toolchain install "$toolchain"; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          elan override set "$toolchain"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Record tool versions
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p validation
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "runner=$(uname -a)"
            lean --version
            lake --version
          } | tee validation/tool-versions.txt

      - name: Prebuild accepted dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p validation
          /usr/bin/time -f $'elapsed_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M' \
            lake build BusyLean.Comparison13 BusyLean.MetaReflectionFacts \
              BusyLean.ReflectionFacts > validation/prebuild.log 2>&1

      - name: Compile definitions, comparisons, and audit
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p validation
          rc=0
          run_one () {
            local label="$1"
            shift
            echo "===== ${label}: $* =====" | tee "validation/${label}.log"
            /usr/bin/time -f $'elapsed_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S\nmax_rss_kb=%M' \
              "$@" >> "validation/${label}.log" 2>&1
            local status=$?
            echo "exit_status=${status}" | tee -a "validation/${label}.log"
            if [ "$status" -ne 0 ]; then rc=1; fi
          }
          run_one definition lake build BusyLean.Contender14
          run_one comparison lake build BusyLean.Comparison14
          run_one audit lake env lean test/Contender14Audit.lean
          exit "$rc"

      - name: Upload validation bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contender14-validation
          if-no-files-found: error
          retention-days: 7
          path: |
            validation/
            BusyLean/Contender14.lean
            BusyLean/Comparison14.lean
            test/Contender14Audit.lean
