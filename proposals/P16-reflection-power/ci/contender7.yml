name: Contender 7 kernel validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'BusyLean/**'
      - 'BusyLean.lean'
      - 'test/Contender7Audit.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'

jobs:
  kernel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
      - name: Show pinned toolchain
        run: cat lean-toolchain
      - name: Build from a clean Lake state
        run: |
          rm -rf .lake
          lake build
      - name: Run closure and axiom audit
        run: lake env lean test/Contender7Audit.lean
      - name: Run package-side static checks
        run: |
          python3 scripts/static_audit.py
          python3 scripts/finite_model.py
